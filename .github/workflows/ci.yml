name: CI

# Validate Rust code, documentation, and portable website widgets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt,clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --locked
      - name: Build
        run: cargo +stable build --release --locked
      - name: Document
        run: cargo +stable doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check documentation and configuration formatting
        run: npx prettier@3.9.10 --check .

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the minimum supported Rust version
        run: |
          rust_version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "RUST_VERSION=$rust_version" >> "$GITHUB_ENV"
      - name: Install it
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Check on it
        run: cargo "+$RUST_VERSION" check --locked --all-targets

  widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the local renderer
        run: cargo +stable build --release --locked
      - name: Generate offline website fixtures
        run: |
          target/release/ltkoi animate-betta tests/fixtures/leetcode/betta-snapshot.json --output-dir target/animated-betta
          target/release/ltkoi animate-pond tests/fixtures/account-with-history.json tests/fixtures/leetcode/betta-snapshot.json --output-dir target/animated-pond
      - name: Verify website interaction
        run: npm run test:widget
