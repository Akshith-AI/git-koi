name: End to end

# Offline fixtures keep pull requests independent of public API availability.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build
        run: cargo +stable build --release --locked
      - name: Exercise all Action modes from source
        env:
          LTKOI_LEETCODE_SNAPSHOT: tests/fixtures/leetcode/betta-snapshot.json
          LTKOI_GITHUB_SNAPSHOT: tests/fixtures/account-with-history.json
        run: |
          export PATH="$PWD/target/release:$PATH"
          for mode in betta pond koi; do
            LTKOI_MODE="$mode" LTKOI_OUTPUT_DIR="fish-$mode" bash scripts/run-action.sh
            test -s "fish-$mode/$mode.gif"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-modes
          path: fish-*/
          if-no-files-found: error
