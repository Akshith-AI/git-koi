name: Release

# Build this fork's binaries, stage a draft release, verify all Action modes
# against its downloaded assets, then publish and update the v0 convenience tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and release
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Check the tag against the manifest and the changelog
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "tag $RELEASE_TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Rust
        run:
          rustup toolchain install stable --profile minimal --target ${{
          matrix.target }}
      - name: Build
        run:
          cargo +stable build --release --locked --target ${{ matrix.target }}
      - name: Package with a checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_STEM:
            ltkoi-${{ needs.verify.outputs.version }}-${{ matrix.target }}
        run: |
          mkdir "$ARCHIVE_STEM"
          cp LICENSE NOTICE.md README.md CHANGELOG.md "$ARCHIVE_STEM"/
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/ltkoi.exe" "$ARCHIVE_STEM"/
            archive="$ARCHIVE_STEM.zip"
            7z a -tzip "$archive" "$ARCHIVE_STEM" > /dev/null
          else
            cp "target/$TARGET/release/ltkoi" "$ARCHIVE_STEM"/
            archive="$ARCHIVE_STEM.tar.gz"
            tar -czf "$archive" "$ARCHIVE_STEM"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            ltkoi-*.tar.gz
            ltkoi-*.zip
            ltkoi-*.sha256
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish the GitHub Release with the changelog section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="$VERSION" '
            /^## \[/ { printing = index($0, "[" version "]") > 0; next }
            /^\[[^]]+\]: / { printing = 0 }
            printing
          ' CHANGELOG.md > release-notes.md
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "LTKoi $RELEASE_TAG" \
              --draft --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

  smoke:
    needs: release
    # GitHub requires write access to see draft release assets. Normal Action
    # consumers need only read access after the release becomes public.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        mode: [betta, pond, koi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./
        id: fish
        with:
          mode: ${{ matrix.mode }}
          leetcode-snapshot: tests/fixtures/leetcode/betta-snapshot.json
          github-snapshot: tests/fixtures/account-with-history.json
          output-dir: fish-${{ matrix.mode }}
      - name: Verify downloaded binary output
        env:
          GIF_PATH: ${{ steps.fish.outputs.gif-path }}
        run: test -s "$GIF_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-smoke-${{ matrix.mode }}
          path: fish-${{ matrix.mode }}/
          if-no-files-found: error

  publish:
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Publish the verified draft
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Update the major convenience tag after smoke tests
        run: |
          major_tag="v${VERSION%%.*}"
          if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major_tag" \
              -f sha="$(git rev-parse HEAD)" -F force=true > /dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$major_tag" -f sha="$(git rev-parse HEAD)" > /dev/null
          fi
