name: LTKoi fish
description:
  Draw your LeetCode Halfmoon betta or a shared pond with a GitHub koi, as a GIF
  and interactive website embed.
branding:
  icon: droplet
  color: orange
inputs:
  mode:
    description: "Output mode: betta, pond, or koi."
    default: betta
  leetcode-username:
    description:
      Public LeetCode username, required for betta and pond unless a snapshot is
      supplied.
  github-username:
    description: GitHub account for pond and koi modes.
    default: ${{ github.repository_owner }}
  body:
    description:
      "GitHub-only koi body: white, black, asagi, tea, gold, platinum."
    default: white
  output-dir:
    description: Relative output folder in the checked-out workspace.
    default: fish
  leetcode-snapshot:
    description: Optional path to a previously collected LeetCode JSON snapshot.
  github-snapshot:
    description: Optional path to a previously collected GitHub JSON snapshot.
  token:
    description:
      Token for reading public GitHub data and release assets; the built-in
      token is enough.
    default: ${{ github.token }}
outputs:
  gif-path:
    description: Relative path to the generated GIF.
    value: ${{ steps.fish.outputs.gif-path }}
  preview-path:
    description: Relative path to the generated preview page.
    value: ${{ steps.fish.outputs.preview-path }}
  mode:
    description: Validated output mode.
    value: ${{ steps.fish.outputs.mode }}
runs:
  using: composite
  steps:
    - name: Install the LTKoi release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install-release.sh"
    - name: Collect profiles and generate fish
      id: fish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        LTKOI_MODE: ${{ inputs.mode }}
        LTKOI_LEETCODE_USERNAME: ${{ inputs.leetcode-username }}
        LTKOI_GITHUB_USERNAME: ${{ inputs.github-username }}
        LTKOI_BODY: ${{ inputs.body }}
        LTKOI_OUTPUT_DIR: ${{ inputs.output-dir }}
        LTKOI_LEETCODE_SNAPSHOT: ${{ inputs.leetcode-snapshot }}
        LTKOI_GITHUB_SNAPSHOT: ${{ inputs.github-snapshot }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-action.sh"
