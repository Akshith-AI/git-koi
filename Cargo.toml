[package]
name = "ltkoi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "LeetCode Halfmoon bettas and GitHub koi, as animated GIFs and interactive website embeds."
repository = "https://github.com/Akshith-AI/git-koi"
publish = false
readme = "README.md"
license = "MIT"
keywords = ["leetcode", "github", "betta", "pixel-art", "gif"]
categories = ["command-line-utilities", "visualization"]
exclude = ["/.github", "/docs"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
gif = { version = "0.14", default-features = false, features = ["std"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
